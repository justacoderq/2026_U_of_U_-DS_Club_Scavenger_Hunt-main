<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scavenger Hunt QR Codes</title>
<style>
    @page { size: letter landscape; margin: 0.35in; }

    body { font-family: sans-serif; margin: 24px; color: #111; }
    h1 { margin: 0 0 16px; font-size: 1.4rem; text-align: center; }
    .qr-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
    .qr-card { display: grid; justify-items: center; break-inside: avoid; }
    .qr-card img { display: block; width: 100%; max-width: 600px; height: auto; }
    .qr-label { margin-top: 4px; font-size: 0.68rem; font-weight: 600; text-align: center; }

    @media (max-width: 580px) {
        .qr-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media print {
        body { margin: 0; }
        h1 { margin-bottom: 10px; }
        .qr-grid { gap: 10px; }
        .qr-card img { max-width: 2.15in; }
    }
</style>
</head>
<body>
<h1>Scavenger Hunt QR Codes</h1>
<div class="qr-grid">
    <div class="qr-card"><img src="route1_stage1.png" alt="QR for Route 1, Stage 1" /><div class="qr-label">Route 1 · Stage 1</div></div>
    <div class="qr-card"><img src="route1_stage2.png" alt="QR for Route 1, Stage 2" /><div class="qr-label">Route 1 · Stage 2</div></div>
    <div class="qr-card"><img src="route1_stage3.png" alt="QR for Route 1, Stage 3" /><div class="qr-label">Route 1 · Stage 3</div></div>
    <div class="qr-card"><img src="route1_stage4.png" alt="QR for Route 1, Stage 4" /><div class="qr-label">Route 1 · Stage 4</div></div>
    <div class="qr-card"><img src="route2_stage1.png" alt="QR for Route 2, Stage 1" /><div class="qr-label">Route 2 · Stage 1</div></div>
    <div class="qr-card"><img src="route2_stage2.png" alt="QR for Route 2, Stage 2" /><div class="qr-label">Route 2 · Stage 2</div></div>
    <div class="qr-card"><img src="route2_stage3.png" alt="QR for Route 2, Stage 3" /><div class="qr-label">Route 2 · Stage 3</div></div>
    <div class="qr-card"><img src="route2_stage4.png" alt="QR for Route 2, Stage 4" /><div class="qr-label">Route 2 · Stage 4</div></div>
    <div class="qr-card"><img src="route3_stage1.png" alt="QR for Route 3, Stage 1" /><div class="qr-label">Route 3 · Stage 1</div></div>
    <div class="qr-card"><img src="route3_stage2.png" alt="QR for Route 3, Stage 2" /><div class="qr-label">Route 3 · Stage 2</div></div>
    <div class="qr-card"><img src="route3_stage3.png" alt="QR for Route 3, Stage 3" /><div class="qr-label">Route 3 · Stage 3</div></div>
    <div class="qr-card"><img src="route3_stage4.png" alt="QR for Route 3, Stage 4" /><div class="qr-label">Route 3 · Stage 4</div></div>
</div>
</body>
</html>
