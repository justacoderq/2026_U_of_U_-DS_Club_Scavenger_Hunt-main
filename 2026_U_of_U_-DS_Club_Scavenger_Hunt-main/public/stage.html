<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scavenger Hunt - Question</title>

    <link rel="stylesheet" href="/css/style.css" />
    <link rel="icon" href="/assets/images/SCClubLogo.png" type="image/x-icon" />

    <!-- Load scripts: routes.js first, then validator.js -->
    <script src="/js/routes.js" defer></script>
    <script src="/js/validator.js" defer></script>
</head>

<body>
<header class="header">
    <div class="header-left">
        <img src="/assets/images/SCClubLogo.png" alt="DS Club Logo" class="club-logo" />
        <div class="club-name">
            The Data Science Club<br />
            <span class="subtext">at the University of Utah</span>
        </div>
    </div>
    <div class="header-right">
        <button class="menu-toggle" id="menuBtn">&#9776;</button>
        <nav class="menu" id="menuDropdown">
            <a href="/leaderboard.html">Leaderboard</a>
            <a href="/prizes.html">Prizes</a>
            <a href="https://discord.gg/k7vP4fjRY7" target="_blank" rel="noopener noreferrer">Join Our Discord</a>
        </nav>
    </div>
</header>

<main>
    <section class="overview">
        <h1 id="question-title">Loading question...</h1>
        <p id="question-text">Loading...</p>

        <p id="hintText" style="display:none; font-style: italic; color: #666;"></p>
        <button id="hintBtn" class="start-btn" style="background:#888; margin-bottom:20px;">
            Show Hint
        </button>

        <form id="clueForm">
            <label for="teamName">Team Name:</label>
            <input type="text" id="teamName" placeholder="Enter your team name" required />

            <label for="answerInput">Your Answer:</label>
            <input type="text" id="answerInput" placeholder="Enter your answer" required />

            <p id="errorMsg" style="color: red; font-weight: 500; display: none;">
                Incorrect, try again!
            </p>

            <button type="submit" class="start-btn">Submit Answer</button>
        </form>
    </section>
</main>

<footer>
    <div class="footer-links">
        <a href="https://campusconnect.utah.edu/feeds?type=club&type_id=36352&tab=about"
           class="footer-link"
           target="_blank"
           rel="noopener noreferrer">
            Campus Connect
        </a>

        <a href="https://discord.gg/k7vP4fjRY7" class="footer-link" target="_blank" rel="noopener noreferrer">Discord</a>
    </div>
    <p class="footer-note">All contact information will be deleted after the event.</p>
</footer>

<script src="/js/menu.js" defer></script>

</body>
</html>
